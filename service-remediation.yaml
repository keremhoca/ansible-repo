---
- name: Ensure chronyd is running
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check chronyd status
      ansible.builtin.command:
        cmd: systemctl is-active chronyd
      register: chronyd_status
      changed_when: false
      failed_when: false

    - name: Show current chronyd state
      ansible.builtin.debug:
        msg: "chronyd current state: {{ chronyd_status.stdout }}"

    - name: Start and enable chronyd if needed
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true
      when: chronyd_status.stdout != "active"

    - name: Verify chronyd status after remediation
      ansible.builtin.command:
        cmd: systemctl is-active chronyd
      register: chronyd_final_status
      changed_when: false
      failed_when: false

    - name: Show final chronyd state
      ansible.builtin.debug:
        msg: "chronyd final state: {{ chronyd_final_status.stdout }}"

    - name: Fail if chronyd is still not active
      ansible.builtin.fail:
        msg: "chronyd remediation failed. Current state: {{ chronyd_final_status.stdout }}"
      when: chronyd_final_status.stdout != "active"
