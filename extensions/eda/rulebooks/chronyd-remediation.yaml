---
- name: Chronyd event remediation
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Start chronyd remediation when service is down
      condition: >
        event.payload.service == "chronyd"
        and event.payload.status == "down"

      action:
        run_job_template:
          name: "Chronyd Remediation"
          organization: "Default"
